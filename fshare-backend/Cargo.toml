[package]
name = "fshare-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "*", features = ["full"]}
axum = {version = "*", features =["macros"]}
uuid = {version = "*", features = ["v4","serde"]}
anyhow = "*"
axum-anyhow = "*"
serde = {version="*", features = ["derive"]}
ctrlc = "3.5.2"
mime_guess = "2.0.5"
tower = "*"
tower-http = { version = "0.7.1", features = ["fs","trace"] }
tracing = "*"
tracing-subscriber = "*"
axum-keycloak-auth = "0.8.3"
thumbnails = {git = "https://github.com/jegkanikkeheddemike/thumbnails"}
futures = "*"

migration = {path ="../migration"}
sea-orm = "*"