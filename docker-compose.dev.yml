services:
  fshare-backend:
    network_mode: host
    build:
      context: ./fshare-backend
      target: development
    volumes:
      - ./fshare-backend:/app
      - ./public:/public
    user: "${UserID}:${GroupID}"

  fshare-web:
    network_mode: host
    build:
      context: ./fshare-web
      target: development
    volumes:
      - ./fshare-web:/app
      # - /app/node_modules
    command: npm run dev

  caddy:
    network_mode: host
    image: caddy:2-alpine
    restart: unless-stopped
    # ports:
    #   - "443:443"
    #   - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fshare-backend
      - fshare-web

  # avahi:
  #   image: flungo/avahi:latest
  #   network_mode: host
  #   environment:
  #     SERVER_HOST_NAME: fshare
  #     SERVER_DOMAIN_NAME: local
  #     SERVER_USE_IPV4: "yes"
  #     SERVER_USE_IPV6: "no"
  #   restart: unless-stopped

volumes:
  caddy-data:
  caddy-config: