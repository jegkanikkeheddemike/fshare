services:
  fshare-backend:
    build:
      context: ./fshare-backend
      target: development
    volumes:
      - ./fshare-backend:/app
      - ./public:/public
    user: "${UserID}:${GroupID}"

  fshare-web:
    build:
      context: ./fshare-web
      target: development
    volumes:
      - ./fshare-web:/app
      # - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fshare-backend
      - fshare-web

volumes:
  caddy-data:
  caddy-config: