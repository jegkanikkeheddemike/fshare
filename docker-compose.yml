services:
  api:
    build:
      context: .
      target: api-development
    volumes:
      - ./fshare-backend:/app
      - ./migration:/migration
      - ./data:/data
    networks:
    - fshare-internal
    environment:
      DATABASE_URL: postgres://fshare:fshare-password@postgres:5432/fshare-md

  web:
    build:
      context: .
      target: web-development
    volumes:
      - ./fshare-web:/app
    command: npm run dev -- --host 0.0.0.0
    networks:
    - fshare-internal

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: fshare
      POSTGRES_PASSWORD: fshare-password
      POSTGRES_DB: fshare-md
    networks:
    - fshare-internal
    ports:
    - "5432:5432"
  
  caddy:
    image: caddy:2
    restart: unless-stopped
    networks:
    - fshare-internal
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

networks:
  fshare-internal: