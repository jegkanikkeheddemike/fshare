services:
  api:
    build:
      context: ./fshare-backend
      target: development
    volumes:
      - ./fshare-backend:/app
      - ./data/public:/public
      - ./data/users:/users
      - ./data/thumbnails:/thumbnails
    networks:
    - fshare-internal

  web:
    build:
      context: ./fshare-web
      target: development
    volumes:
      - ./fshare-web:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
    - fshare-internal

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    networks:
    - fshare-internal
  
  caddy:
    image: caddy:2
    restart: unless-stopped
    networks:
    - fshare-internal
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

networks:
  fshare-internal: